<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>STRATEGIC WORK ARCHETYPE | BIG5 × MBTI 30問精密ジョブ診断</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #070b14;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-subtle: rgba(148, 163, 184, 0.16);
      --accent-cyan: #06b6d4;
      --accent-indigo: #6366f1;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background-color: var(--bg-base);
      color: #f8fafc;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(6, 182, 212, 0.12), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.14), transparent 40%);
    }
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.65);
    }
    .btn-option {
      transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-option:active {
      transform: scale(0.98);
    }
    .btn-option.selected {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.24), rgba(99, 102, 241, 0.28));
      border-color: #22d3ee;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.22);
    }
    .fade-in {
      animation: fadeIn 0.28s ease-out forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #070b14;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

  <!-- Header -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-950/85 backdrop-blur-md">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2.5 cursor-pointer" onclick="app.goHome()">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-cyan-400 to-indigo-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-compass-drafting text-slate-950 text-sm"></i>
        </div>
        <div>
          <span class="font-extrabold tracking-wider text-xs text-slate-100 block leading-none">JOB ARCHETYPE</span>
          <span class="text-[10px] text-cyan-400 font-semibold tracking-widest">BIG5 × MBTI 30Q</span>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="app.openAllTypes()" class="px-2.5 py-1.5 rounded-lg bg-slate-900 hover:bg-slate-800 border border-slate-700/80 text-xs font-semibold text-slate-300 flex items-center
